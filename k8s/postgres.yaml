# Development credentials. For a real production, create this Secret out of band instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pipeline
stringData:
  POSTGRES_USER: pipeline
  POSTGRES_PASSWORD: pipeline
  POSTGRES_DB: pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pipeline
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pipeline
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false # Service env vars (POSTGRES_PORT=tcp://...) would clash with ours
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 3
            failureThreshold: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
