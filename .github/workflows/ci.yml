name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"

  pipeline:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Start Postgres and the local S3 (Garage)
        run: docker compose up -d --wait postgres garage
      - name: Init Garage (layout, bucket, access key)
        run: ./scripts/init_garage.sh
      - name: Generate CSV files and upload them to S3
        run: python -m pipeline.generate --out-dir data/incoming --s3
      - name: Run pipeline (S3 download + processing + insertion)
        run: python -m pipeline.run --source s3
      - name: Integration tests (values in database)
        run: pytest -m integration
      - name: Services logs on failure
        if: failure()
        run: docker compose logs --tail=100
