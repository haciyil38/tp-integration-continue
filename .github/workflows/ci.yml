name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"

  pipeline:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Start Postgres and the local S3 (Garage)
        run: docker compose up -d --wait postgres garage
      - name: Init Garage (layout, bucket, access key)
        run: ./scripts/init_garage.sh
      - name: Generate CSV files and upload them to S3
        run: python -m pipeline.generate --out-dir data/incoming --s3
      - name: Run pipeline (S3 download + processing + insertion)
        run: python -m pipeline.run --source s3
      - name: Integration tests (values in database)
        run: pytest -m integration
      - name: Services logs on failure
        if: failure()
        run: docker compose logs --tail=100

  # Continuous deployment: only on main, only once everything above is green.
  # Deploys the production setup (S3, database, scheduled pipeline) to a throwaway Kubernetes
  # cluster (kind) running inside the runner, checks it works, then publishes the image.
  deploy:
    needs: pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/haciyil38/tp-integration-continue/pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Build the pipeline image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: pipeline
      - name: Load the image into the cluster
        run: kind load docker-image "$IMAGE:latest" --name pipeline
      - name: Deploy (Postgres, Garage, CronJob)
        run: ./scripts/deploy_k8s.sh
      - name: Verify the deployment (seed, scheduled job, database content)
        run: ./scripts/verify_k8s.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n pipeline get all,pvc
          kubectl -n pipeline describe pods | tail -n 80
          kubectl -n pipeline logs statefulset/garage --tail=50 || true
          kubectl -n pipeline logs -l job-name --tail=50 --all-containers || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        run: docker push --all-tags "$IMAGE"
